name: Lint
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [ opened, synchronize ]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Check if frontend was modified
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
            - 'dev/user-frontend-ionic/**'
            - 'dev/user-frontend-ionic/.eslintrc.*'
            - 'dev/user-frontend-ionic/eslint.config.*'

      - name: Read Node.js version
        id: node_version
        if: steps.changes.outputs.frontend == 'true'
        run: echo NODE_VERSION=$(cat dev/user-frontend-ionic/.nvmrc) >> $GITHUB_OUTPUT

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}

      - name: Prepare environment
        if: steps.changes.outputs.frontend == 'true'
        run: |
          cd dev/user-frontend-ionic
          cp angular.json.dist angular.json
          cp -r src/theme/app-theme-dist src/theme/app-theme
          npm ci

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        run: |
          cd dev/user-frontend-ionic
          npm run lint


  backend-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Check if backend was modified
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            main:
            - 'dev/user-backend-nest/main/**/*.ts'
            - 'dev/user-backend-nest/main/.eslintrc.*'
            - 'dev/user-backend-nest/main/eslint.config.*'

      - name: Read Node.js version
        id: node_version
        if: steps.changes.outputs.main == 'true'
        run: echo NODE_VERSION=$(cat dev/user-backend-nest/.nvmrc) >> $GITHUB_OUTPUT

      - name: Set up Node.js
        if: steps.changes.outputs.main == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}

      - name: Prepare environment
        if: steps.changes.outputs.main == 'true'
        run: |
          cd dev/user-backend-nest/main
          npm ci

      - name: Lint
        if: steps.changes.outputs.main == 'true'
        run: |
          cd dev/user-backend-nest/main
          npm run lint


  backend-microservices:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - card
          - card-eu
          - chatbot
          - clocking
          - contact-us
          - contacts
          - features
          - important-news
          - knowledge-base
          - mail-calendar
          - map
          - notifications
          - restaurants
          - rss
          - schedule
          - social-network
          - static-pages
          - statistics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Check if backend was modified
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            auth:
            - 'dev/user-backend-nest/microservices/auth/**/*.ts'
            - 'dev/user-backend-nest/microservices/auth/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/auth/eslint.config.*'
            card:
            - 'dev/user-backend-nest/microservices/card/**/*.ts'
            - 'dev/user-backend-nest/microservices/card/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/card/eslint.config.*'
            card-eu:
            - 'dev/user-backend-nest/microservices/card-eu/**/*.ts'
            - 'dev/user-backend-nest/microservices/card-eu/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/card-eu/eslint.config.*'
            chatbot:
            - 'dev/user-backend-nest/microservices/chatbot/**/*.ts'
            - 'dev/user-backend-nest/microservices/chatbot/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/chatbot/eslint.config.*'
            clocking:
            - 'dev/user-backend-nest/microservices/clocking/**/*.ts'
            - 'dev/user-backend-nest/microservices/clocking/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/clocking/eslint.config.*'
            contact-us:
            - 'dev/user-backend-nest/microservices/contact-us/**/*.ts'
            - 'dev/user-backend-nest/microservices/contact-us/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/contact-us/eslint.config.*'
            contacts:
            - 'dev/user-backend-nest/microservices/contacts/**/*.ts'
            - 'dev/user-backend-nest/microservices/contacts/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/contacts/eslint.config.*'
            features:
            - 'dev/user-backend-nest/microservices/features/**/*.ts'
            - 'dev/user-backend-nest/microservices/features/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/features/eslint.config.*'
            important-news:
            - 'dev/user-backend-nest/microservices/important-news/**/*.ts'
            - 'dev/user-backend-nest/microservices/important-news/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/important-news/eslint.config.*'
            knowledge-base:
            - 'dev/user-backend-nest/microservices/knowledge-base/**/*.ts'
            - 'dev/user-backend-nest/microservices/knowledge-base/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/knowledge-base/eslint.config.*'
            mail-calendar:
            - 'dev/user-backend-nest/microservices/mail-calendar/**/*.ts'
            - 'dev/user-backend-nest/microservices/mail-calendar/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/mail-calendar/eslint.config.*'
            map:
            - 'dev/user-backend-nest/microservices/map/**/*.ts'
            - 'dev/user-backend-nest/microservices/map/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/map/eslint.config.*'
            notifications:
            - 'dev/user-backend-nest/microservices/notifications/**/*.ts'
            - 'dev/user-backend-nest/microservices/notifications/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/notifications/eslint.config.*'
            restaurants:
            - 'dev/user-backend-nest/microservices/restaurants/**/*.ts'
            - 'dev/user-backend-nest/microservices/restaurants/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/restaurants/eslint.config.*'
            rss:
            - 'dev/user-backend-nest/microservices/rss/**/*.ts'
            - 'dev/user-backend-nest/microservices/rss/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/rss/eslint.config.*'
            schedule:
            - 'dev/user-backend-nest/microservices/schedule/**/*.ts'
            - 'dev/user-backend-nest/microservices/schedule/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/schedule/eslint.config.*'
            social-network:
            - 'dev/user-backend-nest/microservices/social-network/**/*.ts'
            - 'dev/user-backend-nest/microservices/social-network/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/social-network/eslint.config.*'
            static-pages:
            - 'dev/user-backend-nest/microservices/static-pages/**/*.ts'
            - 'dev/user-backend-nest/microservices/static-pages/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/static-pages/eslint.config.*'
            statistics:
            - 'dev/user-backend-nest/microservices/statistics/**/*.ts'
            - 'dev/user-backend-nest/microservices/statistics/.eslintrc.*'
            - 'dev/user-backend-nest/microservices/statistics/eslint.config.*'

      - name: Read Node.js version
        id: node_version
        if: steps.changes.outputs[${{ matrix.service }}] == 'true'
        run: echo NODE_VERSION=$(cat dev/user-backend-nest/.nvmrc) >> $GITHUB_OUTPUT

      - name: Set up Node.js
        if: steps.changes.outputs[${{ matrix.service }}] == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}

      - name: Prepare environment
        if: steps.changes.outputs[${{ matrix.service }}] == 'true'
        run: |
          cd dev/user-backend-nest/microservices/${{ matrix.service }}
          npm ci

      - name: Lint ${{ matrix.service }}
        if: steps.changes.outputs[${{ matrix.service }}] == 'true'
        run: |
          cd dev/user-backend-nest/microservices/${{ matrix.service }}
          npm run lint

  connectors:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - multi-cms-connector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Check if connectors were modified
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            multi-cms-connector:
            - 'dev/connectors/multi-cms-connector/**/*.ts'
            - 'dev/connectors/multi-cms-connector/.eslintrc.*'
            - 'dev/connectors/multi-cms-connector/eslint.config.*'

      - name: Read Node.js version
        id: node_version
        if: steps.changes.outputs[${{ matrix.service }}] == 'true'
        run: echo NODE_VERSION=$(cat dev/connectors/${{ matrix.service }}/.nvmrc) >> $GITHUB_OUTPUT

      - name: Set up Node.js
        if: steps.changes.outputs[${{ matrix.service }}] == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}

      - name: Prepare environment
        if: steps.changes.outputs[${{ matrix.service }}] == 'true'
        run: |
          cd dev/connectors/${{ matrix.service }}
          npm ci

      - name: Lint ${{ matrix.service }}
        if: steps.changes.outputs[${{ matrix.service }}] == 'true'
        run: |
          cd dev/connectors/${{ matrix.service }}
          npm run lint
